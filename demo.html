const SquadBuilder=({mob})=>{const[fm,setFm]=useState("4-3-3");const[sel,setSel]=useState(null);const[squad,setSquad]=useState({});const budget=120;const spent=Object.values(squad).reduce((s,p)=>s+(p?.value||0),0);const rem=budget-spent;const f=FORMATIONS[fm];const assign=(p)=>{if(sel!==null&&rem>=p.value){setSquad({...squad,[sel]:p});setSel(null);}};return(<div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}><Sec mob={mob}>Squad Builder</Sec><div style={{display:"flex",gap:4}}>{Object.keys(FORMATIONS).map(k=>(<button key={k} onClick={()=>{setFm(k);setSquad({});}} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${fm===k?C.gold:C.border}`,background:fm===k?C.goldDim:"transparent",color:fm===k?C.gold:C.textDim,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:mono}}>{k}</button>))}</div></div><div style={{background:C.card,borderRadius:8,padding:"8px 12px",marginBottom:12,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:9,color:C.textDim,textTransform:"uppercase",fontWeight:700}}>Budget</span><div style={{flex:1,height:5,background:"#1a2540",borderRadius:3,overflow:"hidden"}}><div style={{width:`${(spent/budget)*100}%`,height:"100%",borderRadius:3,background:rem<10?C.red:C.accent}}/></div><span style={{fontSize:12,fontWeight:800,color:rem<10?C.red:C.accent,fontFamily:mono}}>${rem.toFixed(1)}M</span></div><div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 240px",gap:12}}><div style={{background:`linear-gradient(180deg,#14532d,${C.pitch},#14532d)`,borderRadius:12,padding:10,position:"relative",aspectRatio:mob?"4/5":"3/4",border:"2px solid #166534",overflow:"hidden",minHeight:mob?300:undefined}}><div style={{position:"absolute",inset:10,border:"2px solid rgba(255,255,255,0.15)",borderRadius:4}}/><div style={{position:"absolute",left:"50%",top:"50%",width:50,height:50,border:"2px solid rgba(255,255,255,0.1)",borderRadius:"50% tWeight:700,color:C.textDim,fontFamily:mono}}>${p.value}M</span></div>);})}</div></div></div>);};

rm:"uppercase"}}>Attributes</h4>{rd.map((s,i)=><StatBar key={i} label={s.l} value={s.v}/>)}</div></div></div></div></div>);};

const FantasyLeaderboard=({mob})=>(<div><Sec sub="GW 12 · 350+ managers" mob={mob}>Leaderboard</Sec>{!mob&&<div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:18}}>{[FLBOARD[1],FLBOARD[0],FLBOARD[2]].map((e,idx)=>{const pl=idx===1?1:idx===0?2:3;const cols={1:C.gold,2:C.silver,3:C.bronze};const hs={1:90,2:70,3:60};return(<div key={idx} style={{textAlign:"center"}}><div style={{width:36,height:36,borderRadius:"50%",background:`linear-gradient(135deg,${cols[pl]},${cols[pl]}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:900,color:"#000",margin:"0 auto 4px"}}>{pl}</div><div style={{fontSize:12,fontWeight:700,color:C.text}}>{e.name}</div><div style={{width:80,height:hs[pl],background:`linear-gradient(180deg,${cols[pl]}33,${cols[pl]}08)`,borderRadius:"8px 8px 0 0",marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${cols[pl]}33`,borderBottom:"none",margin:"4px auto 0"}}><span style={{fontSize:16,fontWeight:900,color:cols[pl],fontFamily:mono}}>{e.pts}</span></div></div>);})}</div>}<div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,overflow:"hidden"}}>{FLBOARD.map((e,i)=>{const isU=e.name==="YouAreHere";return(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:mob?"10px 10px":"10px 14px",borderTop:i>0?`1px solid ${C.border}`:"none",background:isU?C.goldDim:"transparent"}}><div style={{display:"flex",alignItems:"center",gap:mob?8:10}}><span style={{fontSize:13,fontWeight:900,color:i===0?C.gold:i===1?C.silver:i===2?C.bronze:C.textDim,fontFamily:mono,width:20}}>{e.rank}</span><span style={{fontSize:12,fontWeight:isU?700:500,color:isU?C.gold:C.text}}>{isU?"⭐ You":e.name}</span>{e.badge&&<span style={{fontSize:12}}>{e.badge}</span>}</div><div style={{display:"flex",alignItems:"center",gap:mob?8:14}}><span style={{fontSize:12,fontWeight:800,color:C.text,fontFamily:mono}}>{e.pts}</span>{!mob&&<div style={{display:"flex",gap:2}}>{e.form.split("").map((r,j)=>(<span key={j} style={{width:16,height:16,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:800,background:r==="W"?C.greenDim:r==="D"?C.yellowDim:C.redDim,color:r==="W"?C.green:r==="D"?C.yellow:C.red}}>{r}</span>))}</div>}</div></div>);})}</div></div>);

const LeagueCreation=({mob})=>{const[name,setName]=useState("");const[fmt,setFmt]=useState("round-robin");const[teams,setTeams]=useState("16");const[done,setDone]=useState(false);if(done)return(<div style={{textAlign:"center",padding:"40px 16px"}}><div style={{fontSize:48,marginBottom:10}}>🏟️</div><h2 style={{fontSize:24,fontWeight:800,color:C.text,margin:"0 0 6px",fontFamily:font}}>League Created!</h2><p style={{color:C.textDim,fontSize:12,marginBottom:16}}>Share the code to start competing.</p><div style={{display:"inline-block",background:C.card,borderRadius:10,padding:"12px 24px",border:`1px solid ${C.gold}33`}}><div style={{fontSize:9,color:C.textDim,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Invite Code</div><div style={{fontSize:22,fontWeight:900,color:C.gold,fontFamily:mono,letterSpacing:4}}>SS-XK7-F9M</div></div><div style={{marginTop:16}}><button onClick={()=>setDone(false)} style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.textMid,fontSize:11,cursor:"pointer",fontFamily:font}}>Create Another</button></div></div>);return(<div style={{maxWidth:460,margin:"0 auto"}}><Sec sub="Invite scouts & managers" mob={mob}>Create League</Sec><div style={{display:"flex",flexDirection:"column",gap:14}}><div><label style={{fontSize:9,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>League Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. African Scouts Cup" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:12,outline:"none",fontFamily:font,boxSizing:"border-box"}}/></div><div><label style={{fontSize:9,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>Format</label><div style={{display:"flex",gap:6}}>{[["round-robin","Round Robin"],["knockout","Knockout"],["groups","Groups+KO"]].map(([v,l])=>(<button key={v} onClick={()=>setFmt(v)} style={{flex:1,padding:"8px",borderRadius:8,border:`1px solid ${fmt===v?C.gold:C.border}`,background:fmt===v?C.goldDim:C.card,color:fmt===v?C.gold:C.textDim,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>{l}</button>))}</div></div><div><label style={{fontSize:9,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>Max Teams</label><div style={{display:"flex",gap:5}}>{["8","12","16","20"].map(n=>(<button key={n} onClick={()=>setTeams(n)} style={{width:38,height:34,borderRadius:6,border:`1px solid ${teams===n?C.gold:C.border}`,background:teams===n?C.goldDim:C.card,color:teams===n?C.gold:C.textDim,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:mono}}>{n}</button>))}</div></div><button onClick={()=>name&&setDone(true)} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:name?`linear-gradient(135deg,${C.gold},${C.bronze})`:C.border,color:name?"#000":C.textDim,fontSize:13,fontWeight:700,cursor:name?"pointer":"default",fontFamily:font}}>Create League →</button></div></div>);};

// ═══════════════════════════════════════════════════════════════════
// NAV + MAIN APP
// ═══════════════════════════════════════════════════════════════════
const NAV={
  player:[{id:"p-dash",label:"Dashboard",icon:"📊",S:PlayerDashboard},{id:"p-profile",label:"Profile",icon:"👤",S:({mob})=><PlayerProfile player={GRASSROOTS[0]} mob={mob}/>}],
  scout:[{id:"s-disc",label:"Discover",icon:"🔍",S:ScoutDashboard}],
  academy:[{id:"a-rec",label:"Recruit",icon:"🏟️",S:AcademyDashboard}],
  fantasy:[{id:"f-dash",label:"Dashboard",icon:"📊",S:FantasyDash},{id:"f-squad",label:"Squad",icon:"⚽",S:SquadBuilder},{id:"f-scout",label:"Scouting",icon:"🔍",S:FantasyScouting},{id:"f-board",label:"Board",icon:"🏆",S:FantasyLeaderboard},{id:"f-league",label:"Create",icon:"🏟️",S:LeagueCreation}],
};

function App(){
  const mob=useIsMobile();
  const[role,setRole]=useState("player");const[activeNav,setActiveNav]=useState("p-dash");
  useEffect(()=>{const f=NAV[role]?.[0];if(f)setActiveNav(f.id);},[role]);
  const navItems=NAV[role]||[];const active=navItems.find(n=>n.id===activeNav);const ActiveScreen=active?.S||(()=>null);const rc=RC[role];

  if(mob) return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:C.bg,fontFamily:font}}>
      {/* Top: Logo + Role Switcher */}
      <div style={{background:C.bg2,borderBottom:`1px solid ${C.border}`,padding:"8px 12px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:16,fontWeight:900,color:C.text}}>S<span style={{color:C.accent}}>&</span>S</div>
          <div style={{fontSize:9,color:rc.c,fontWeight:600}}>{rc.label} Mode</div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {Object.entries(RC).map(([key,val])=>(<button key={key} onClick={()=>setRole(key)} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"6px 0",borderRadius:8,border:role===key?`1px solid ${val.c}33`:"1px solid transparent",background:role===key?val.d:"transparent",color:role===key?val.c:C.textDim,fontSize:10,fontWeight:role===key?700:500,cursor:"pointer",fontFamily:font}}><span style={{fontSize:12}}>{val.icon}</span>{val.label}</button>))}
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 12px",paddingBottom:60}}>
        <ActiveScreen mob={true}/>
      </div>

      {/* Bottom: Screen Tabs */}
      <div style={{background:C.bg2,borderTop:`1px solid ${C.border}`,display:"flex",padding:"6px 8px",flexShrink:0}}>
        {navItems.map(n=>(<button key={n.id} onClick={()=>setActiveNav(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 0",borderRadius:8,border:"none",background:activeNav===n.id?`${rc.c}15`:"transparent",color:activeNav===n.id?rc.c:C.textDim,cursor:"pointer",fontFamily:font}}><span style={{fontSize:16}}>{n.icon}</span><span style={{fontSize:8,fontWeight:activeNav===n.id?700:500}}>{n.label}</span></button>))}
      </div>
    </div>
  );

  // Desktop
  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:font,display:"flex"}}>
    <div style={{width:190,background:C.bg2,borderRight:`1px solid ${C.border}`,padding:"14px 8px",display:"flex",flexDirection:"column",flexShrink:0}}>
      <div style={{padding:"0 10px 12px",borderBottom:`1px solid ${C.border}`,marginBottom:12}}><div style={{fontSize:18,fontWeight:900,color:C.text}}>S<span style={{color:C.accent}}>&</span>S</div><div style={{fontSize:8,color:C.textDim,marginTop:1}}>Scout&Stake</div></div>
      <div style={{marginBottom:12}}><div style={{fontSize:8,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1.5,padding:"0 10px",marginBottom:5}}>Role</div>{Object.entries(RC).map(([key,val])=>(<button key={key} onClick={()=>setRole(key)} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 10px",borderRadius:8,border:role===key?`1px solid ${val.c}33`:"1px solid transparent",background:role===key?val.d:"transparent",color:role===key?val.c:C.textDim,fontSize:11,fontWeight:role===key?700:500,cursor:"pointer",textAlign:"left",fontFamily:font,width:"100%",marginBottom:1}}><span style={{fontSize:13}}>{val.icon}</span>{val.label}</button>))}</div>
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,flex:1}}><div style={{fontSize:8,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1.5,padding:"0 10px",marginBottom:5}}>Screens</div>{navItems.map(n=>(<button key={n.id} onClick={()=>setActiveNav(n.id)} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 10px",borderRadius:8,border:"none",width:"100%",background:activeNav===n.id?`${rc.c}15`:"transparent",color:activeNav===n.id?rc.c:C.textDim,fontSize:11,fontWeight:activeNav===n.id?700:500,cursor:"pointer",textAlign:"left",fontFamily:font,marginBottom:1,borderLeft:activeNav===n.id?`2px solid ${rc.c}`:"2px solid transparent"}}><span style={{fontSize:12}}>{n.icon}</span>{n.label}</button>))}</div>
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10}}><div style={{display:"flex",alignItems:"center",gap:7,padding:"4px 10px"}}><div style={{width:26,height:26,borderRadius:"50%",background:`linear-gradient(135deg,${rc.c},${rc.c}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:"#000"}}>YH</div><div><div style={{fontSize:10,fontWeight:600,color:C.text}}>Demo User</div><div style={{fontSize:8,color:rc.c}}>{rc.label}</div></div></div></div>
    </div>
    <div style={{flex:1,padding:20,overflowY:"auto",maxHeight:"100vh"}}><ActiveScreen mob={false}/></div>
  </div>);
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
