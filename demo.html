olor:C.text}}>{b.l}</div><div style={{fontSize:10,color:C.textDim}}>{b.d}</div></div></div>))}</div></div>);

const SquadBuilder=()=>{const[fm,setFm]=useState("4-3-3");const[sel,setSel]=useState(null);const[squad,setSquad]=useState({});const budget=120;const spent=Object.values(squad).reduce((s,p)=>s+(p?.value||0),0);const rem=budget-spent;const f=FORMATIONS[fm];const assign=(p)=>{if(sel!==null&&rem>=p.value){setSquad({...squad,[sel]:p});setSel(null);}};return(<div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><div><h3 style={{fontSize:18,fontWeight:700,color:C.text,margin:0,fontFamily:font}}>Squad Builder</h3><p style={{fontSize:12,color:C.textDim,margin:"2px 0 0"}}>25 players · 5 leagues · Max 5 academy</p></div><div style={{display:"flex",gap:6}}>{Object.keys(FORMATIONS).map(k=>(<button key={k} onClick={()=>{setFm(k);setSquad({});}} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${fm===k?C.gold:C.border}`,background:fm===k?C.goldDim:"transparent",color:fm===k?C.gold:C.textDim,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:mono}}>{k}</button>))}</div></div><div style={{background:C.card,borderRadius:10,padding:"10px 14px",marginBottom:14,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:14}}><span style={{fontSize:10,color:C.textDim,textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>Budget</span><div style={{flex:1,height:7,background:"#1a2540",borderRadius:4,overflow:"hidden"}}><div style={{width:`${(spent/budget)*100}%`,height:"100%",borderRadius:4,background:rem<10?C.red:C.accent}}/></div><span style={{fontSize:13,fontWeight:800,color:rem<10?C.red:C.accent,fontFamily:mono}}>${rem.toFixed(1)}M</span><span style={{fontSize:11,color:C.textDim}}>of ${budget}M</span></div><div style={{display:"grid",gridTemplateColumns:"1fr 260px",gap:14}}><div style={{background:`linear-gradient(180deg,#14532d,${C.pitch},#14532d)`,borderRadius:14,padding:14,position:"relative",aspectRatio:"3/4",border:"2px solid #166534",overflow:"hidden"}}><div style={{position:"absolute",inset:14,border:"2px solid rgba(255,255,255,0.18)",borderRadius:4}}/><div style={{position:"absolute",left:"50%",top:14,bottom:14,width:2,background:"rgba(255,255,255,0.12)",transform:"translateX(-50%)"}}/><div style={{position:"absolute",left:"50%",top:"50%",width:66,height:66,border:"2px solid rgba(255,255,255,0.12)",borderRadius:"50%",transform:"translate(-50%,-50%)"}}/>{f.positions.map((pos,i)=>{const p=squad[i];return(<div key={i} onClick={()=>setSel(i)} style={{position:"absolute",left:`${pos.x}%`,top:`${pos.y}%`,transform:"translate(-50%,-50%)",cursor:"pointer",textAlign:"center",zIndex:2}}><div style={{width:40,height:40,borderRadius:"50%",background:p?(p.isAcademy?`linear-gradient(135deg,${C.gold},${C.bronze})`:`linear-gradient(135deg,${C.accent},#059669)`):"rgba(0,0,0,0.5)",border:`2px solid ${sel===i?"#fff":p?"rgba(255,255,255,0.25)":"rgba(255,255,255,0.12)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:p?"#000":"rgba(255,255,255,0.35)",margin:"0 auto 2px",boxShadow:sel===i?"0 0 18px rgba(255,255,255,0.3)":"0 2px 8px rgba(0,0,0,0.4)"}}>{p?p.img:"+"}</div><div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.75)",textShadow:"0 1px 3px rgba(0,0,0,0.8)"}}>{p?p.name.split(" ").pop():pos.role}</div>{p&&<div style={{fontSize:8,fontWeight:800,color:p.isAcademy?C.gold:"#fff",fontFamily:mono}}>${p.value}M</div>}</div>);})}</div><div style={{background:C.card,borderRadius:12,padding:12,border:`1px solid ${C.border}`,maxHeight:460,overflowY:"auto"}}><h4 style={{fontSize:11,fontWeight:700,color:sel!==null?C.gold:C.textDim,margin:"0 0 8px",textTransform:"uppercase",letterSpacing:1}}>{sel!==null?`Pick for ${f.positions[sel].role}`:"Tap a position"}</h4>{FPLAYERS.map(p=>{const inS=Object.values(squad).some(s=>s?.id===p.id);const ok=rem>=p.value||inS;return(<div key={p.id} onClick={()=>!inS&&ok&&assign(p)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 6px",borderRadius:8,cursor:sel===null||inS||!ok?"default":"pointer",marginBottom:2,background:inS?C.goldDim:"transparent",opacity:sel===null?0.5:!ok&&!inS?0.3:1}}><FAvatar initials={p.img} size={28} ovr={p.ovr} isAcademy={p.isAcademy}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:11,fontWeight:600,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div><div style={{fontSize:9,color:C.textDim}}>{p.pos} · {p.league}</div></div><span style={{fontSize:10,fontWeight:700,color:C.textDim,fontFamily:mono}}>${p.value}M</span></div>);})}</div></div></div>);};

const FantasyScouting=()=>{const[sp,setSp]=useState(FPLAYERS[2]);const[search,setSearch]=useState("");const[acOnly,setAcOnly]=useState(false);const filtered=FPLAYERS.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())&&(!acOnly||p.isAcademy));const p=sp;const rd=[{l:"PAC",v:p.pace},{l:"SHO",v:p.shoot},{l:"PAS",v:p.pass},{l:"DRI",v:p.dribble},{l:"DEF",v:p.defend},{l:"PHY",v:p.physical}];const rp=rd.map((d,i)=>{const a=(Math.PI*2*i)/6-Math.PI/2,r=(d.v/99)*58;return{x:68+Math.cos(a)*r,y:68+Math.sin(a)*r,lx:68+Math.cos(a)*78,ly:68+Math.sin(a)*78,...d};});return(<div><Sec>Player Scouting</Sec><div style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:14}}><div><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{width:"100%",padding:"10px 12px",borderRadius:10,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:12,outline:"none",fontFamily:font,boxSizing:"border-box",marginBottom:6}}/><button onClick={()=>setAcOnly(!acOnly)} style={{width:"100%",padding:7,borderRadius:8,border:`1px solid ${acOnly?C.gold:C.border}`,background:acOnly?C.goldDim:"transparent",color:acOnly?C.gold:C.textDim,fontSize:11,fontWeight:600,cursor:"pointer",marginBottom:8,fontFamily:font}}>⭐ {acOnly?"Academy Only":"Filter Academy"}</button><div style={{maxHeight:380,overflowY:"auto"}}>{filtered.map(pl=>(<div key={pl.id} onClick={()=>setSp(pl)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 6px",borderRadius:8,cursor:"pointer",marginBottom:2,background:pl.id===p.id?C.goldDim:"transparent",border:`1px solid ${pl.id===p.id?C.gold+"33":"transparent"}`}}><FAvatar initials={pl.img} size={30} ovr={pl.ovr} isAcademy={pl.isAcademy}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:C.text}}>{pl.name}</div><div style={{fontSize:10,color:C.textDim}}>{pl.pos} · {pl.club}</div></div><OvrBadge ovr={pl.ovr} size="sm"/></div>))}</div></div><div><div style={{background:C.card,borderRadius:14,padding:20,border:`1px solid ${C.border}`,marginBottom:14}}><div style={{display:"flex",gap:16,alignItems:"flex-start"}}><FAvatar initials={p.img} size={64} ovr={p.ovr} isAcademy={p.isAcademy}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:10}}><h3 style={{fontSize:22,fontWeight:800,color:C.text,margin:0,fontFamily:font}}>{p.name}</h3><OvrBadge ovr={p.ovr} size="lg"/></div><div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}><Pill>{p.pos}</Pill><Pill color={C.textMid}>{p.nation} {p.club}</Pill><Pill color={C.textMid}>Age {p.age}</Pill><Pill color={C.accent}>${p.value}M</Pill>{p.isAcademy&&<Pill color={C.gold} bg={C.goldDim}>⭐ Academy</Pill>}<Pill color={C.blue} bg={C.blueDim}>POT {p.potential}</Pill></div>{p.isAcademy&&<div style={{marginTop:10,padding:"8px 12px",background:C.goldDim,borderRadius:8,border:`1px solid ${C.gold}22`,fontSize:11,color:C.gold}}>💡 Bonus: first goal +35, call-up +20, first start +15</div>}</div></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}><div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}><h4 style={{fontSize:11,fontWeight:700,color:C.textDim,margin:"0 0 8px",textTransform:"uppercase",letterSpacing:1}}>Radar</h4><svg width="100%" viewBox="0 0 136 136">{[0.25,0.5,0.75,1].map((s,i)=>(<polygon key={i} points={rd.map((_,j)=>{const a=(Math.PI*2*j)/6-Math.PI/2;return`${68+Math.cos(a)*58*s},${68+Math.sin(a)*58*s}`;}).join(" ")} fill="none" stroke={C.border} strokeWidth={0.5}/>))}<polygon points={rp.map(pt=>`${pt.x},${pt.y}`).join(" ")} fill={p.isAcademy?`${C.gold}20`:C.accentDim} stroke={p.isAcademy?C.gold:C.accent} strokeWidth={1.5}/>{rp.map((pt,i)=>(<g key={i}><circle cx={pt.x} cy={pt.y} r={2.5} fill={p.isAcademy?C.gold:C.accent}/><text x={pt.lx} y={pt.ly} textAnchor="middle" dominantBaseline="middle" fill={C.textDim} fontSize={7} fontWeight="700">{pt.l}</text></g>))}</svg></div><div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}><h4 style={{fontSize:11,fontWeight:700,color:C.textDim,margin:"0 0 12px",textTransform:"uppercase",letterSpacing:1}}>Attributes</h4><FStatBar label="PAC" value={p.pace}/><FStatBar label="SHO" value={p.shoot}/><FStatBar label="PAS" value={p.pass}/><FStatBar label="DRI" value={p.dribble}/><FStatBar label="DEF" value={p.defend}/><FStatBar label="PHY" value={p.physical}/><div style={{marginTop:12,padding:"8px 10px",background:p.isAcademy?C.goldDim:C.accentDim,borderRadius:8}}><div style={{fontSize:10,fontWeight:600,color:p.isAcademy?C.gold:C.accent,marginBottom:4}}>Form</div><div style={{display:"flex",gap:6,alignItems:"center"}}>{p.form.map((f,i)=><span key={i} style={{fontSize:12,fontWeight:700,color:f>=8?C.accent:f>=7?C.blue:C.gold,fontFamily:mono}}>{f}</span>)}<MiniForm data={p.form} size={56}/></div></div></div></div></div></div></div>);};

const FantasyLeaderboard=()=>(<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><div><h3 style={{fontSize:18,fontWeight:700,color:C.text,margin:0,fontFamily:font}}>Leaderboard</h3><p style={{fontSize:12,color:C.textDim,margin:"2px 0 0"}}>GW 12 · 350+ managers</p></div><div style={{display:"flex",gap:8}}><Pill color={C.gold} bg={C.goldDim}>Weekly: $750</Pill><Pill color={C.accent}>Season: TBD</Pill></div></div><div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:22}}>{[FLBOARD[1],FLBOARD[0],FLBOARD[2]].map((e,idx)=>{const pl=idx===1?1:idx===0?2:3;const cols={1:C.gold,2:C.silver,3:C.bronze};const hs={1:110,2:88,3:78};return(<div key={idx} style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center"}}><div style={{width:44,height:44,borderRadius:"50%",background:`linear-gradient(135deg,${cols[pl]},${cols[pl]}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:900,color:"#000",marginBottom:6,border:`2px solid ${cols[pl]}44`}}>{pl}</div><div style={{fontSize:13,fontWeight:700,color:C.text}}>{e.name}</div><div style={{fontSize:11,color:C.textDim}}>{e.country}</div><div style={{width:96,height:hs[pl],background:`linear-gradient(180deg,${cols[pl]}33,${cols[pl]}08)`,borderRadius:"10px 10px 0 0",marginTop:6,display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${cols[pl]}33`,borderBottom:"none"}}><span style={{fontSize:20,fontWeight:900,color:cols[pl],fontFamily:mono}}>{e.pts}</span></div></div>);})}</div><div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}><div style={{display:"grid",gridTemplateColumns:"40px 1fr 50px 70px 60px 90px",padding:"10px 14px",background:C.bg2,fontSize:10,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1}}><span>#</span><span>Manager</span><span>🌍</span><span>Points</span><span>Scouts</span><span>Form</span></div>{FLBOARD.map((e,i)=>{const isU=e.name==="YouAreHere";return(<div key={i} style={{display:"grid",gridTemplateColumns:"40px 1fr 50px 70px 60px 90px",padding:"12px 14px",alignItems:"center",borderTop:`1px solid ${C.border}`,background:isU?C.goldDim:"transparent"}}><span style={{fontSize:14,fontWeight:900,color:i===0?C.gold:i===1?C.silver:i===2?C.bronze:C.textDim,fontFamily:mono}}>{e.rank}</span><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:isU?700:500,color:isU?C.gold:C.text}}>{isU?"⭐ You":e.name}</span>{e.badge&&<span style={{fontSize:13}}>{e.badge}</span>}</div><span style={{fontSize:14}}>{e.country}</span><span style={{fontSize:13,fontWeight:800,color:C.text,fontFamily:mono}}>{e.pts}</span><span style={{fontSize:12,color:e.discoveries>=3?C.gold:C.textDim}}>{e.discoveries}/5</span><div style={{display:"flex",gap:3}}>{e.form.split("").map((r,j)=>(<span key={j} style={{width:18,height:18,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,background:r==="W"?C.greenDim:r==="D"?C.yellowDim:C.redDim,color:r==="W"?C.green:r==="D"?C.yellow:C.red}}>{r}</span>))}</div></div>);})}</div></div>);

const LeagueCreation=()=>{const[name,setName]=useState("");const[fmt,setFmt]=useState("round-robin");const[teams,setTeams]=useState("16");const[priv,setPriv]=useState(false);const[done,setDone]=useState(false);if(done)return(<div style={{textAlign:"center",padding:"50px 20px"}}><div style={{fontSize:56,marginBottom:14}}>🏟️</div><h2 style={{fontSize:28,fontWeight:800,color:C.text,margin:"0 0 6px",fontFamily:font}}>League Created!</h2><p style={{color:C.textDim,fontSize:13,marginBottom:20}}>Share the code to start competing.</p><div style={{display:"inline-block",background:C.card,borderRadius:12,padding:"14px 28px",border:`1px solid ${C.gold}33`}}><div style={{fontSize:10,color:C.textDim,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Invite Code</div><div style={{fontSize:26,fontWeight:900,color:C.gold,fontFamily:mono,letterSpacing:4}}>SS-XK7-F9M</div></div><div style={{marginTop:20}}><button onClick={()=>setDone(false)} style={{padding:"10px 20px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.textMid,fontSize:12,cursor:"pointer",fontFamily:font}}>Create Another</button></div></div>);return(<div style={{maxWidth:500,margin:"0 auto"}}><Sec sub="Invite scouts & managers">Create League</Sec><div style={{display:"flex",flexDirection:"column",gap:16}}><div><label style={{fontSize:10,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>League Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. African Scouts Cup" style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:13,outline:"none",fontFamily:font,boxSizing:"border-box"}}/></div><div><label style={{fontSize:10,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Format</label><div style={{display:"flex",gap:8}}>{[["round-robin","Round Robin"],["knockout","Knockout"],["groups","Groups + KO"]].map(([v,l])=>(<button key={v} onClick={()=>setFmt(v)} style={{flex:1,padding:"10px",borderRadius:8,border:`1px solid ${fmt===v?C.gold:C.border}`,background:fmt===v?C.goldDim:C.card,color:fmt===v?C.gold:C.textDim,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:font}}>{l}</button>))}</div></div><div><label style={{fontSize:10,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Max Teams</label><div style={{display:"flex",gap:6}}>{["8","12","16","20","32"].map(n=>(<button key={n} onClick={()=>setTeams(n)} style={{width:42,height:38,borderRadius:8,border:`1px solid ${teams===n?C.gold:C.border}`,background:teams===n?C.goldDim:C.card,color:teams===n?C.gold:C.textDim,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:mono}}>{n}</button>))}</div></div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:10,background:C.card,border:`1px solid ${C.border}`}}><div><div style={{fontSize:13,fontWeight:600,color:C.text}}>Private League</div><div style={{fontSize:11,color:C.textDim}}>Invite only</div></div><div onClick={()=>setPriv(!priv)} style={{width:42,height:22,borderRadius:11,background:priv?C.gold:C.border,cursor:"pointer",position:"relative"}}><div style={{width:16,height:16,borderRadius:"50%",background:"#fff",position:"absolute",top:3,left:priv?23:3,transition:"left 0.2s"}}/></div></div><button onClick={()=>name&&setDone(true)} style={{width:"100%",padding:"14px",borderRadius:10,border:"none",background:name?`linear-gradient(135deg,${C.gold},${C.bronze})`:C.border,color:name?"#000":C.textDim,fontSize:14,fontWeight:700,cursor:name?"pointer":"default",fontFamily:font,boxShadow:name?`0 0 25px ${C.goldDim}`:"none"}}>Create League →</button></div></div>);};

// ═══════════════════════════════════════════════════════════════════
// NAV + MAIN APP
// ═══════════════════════════════════════════════════════════════════
const NAV={
  player:[{id:"p-dash",label:"Dashboard",icon:"📊",S:PlayerDashboard},{id:"p-profile",label:"My Profile",icon:"👤",S:()=><PlayerProfile player={GRASSROOTS[0]}/>}],
  scout:[{id:"s-disc",label:"Discover Talent",icon:"🔍",S:ScoutDashboard}],
  academy:[{id:"a-rec",label:"Recruitment Hub",icon:"🏟️",S:AcademyDashboard}],
  fantasy:[{id:"f-dash",label:"Dashboard",icon:"📊",S:FantasyDash},{id:"f-squad",label:"Squad Builder",icon:"⚽",S:SquadBuilder},{id:"f-scout",label:"Player Scouting",icon:"🔍",S:FantasyScouting},{id:"f-board",label:"Leaderboard",icon:"🏆",S:FantasyLeaderboard},{id:"f-league",label:"Create League",icon:"🏟️",S:LeagueCreation}],
};

function App(){
  const[role,setRole]=useState("player");const[activeNav,setActiveNav]=useState("p-dash");
  useEffect(()=>{const f=NAV[role]?.[0];if(f)setActiveNav(f.id);},[role]);
  const navItems=NAV[role]||[];const active=navItems.find(n=>n.id===activeNav);const ActiveScreen=active?.S||(()=>null);const rc=RC[role];
  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:font,display:"flex"}}>
    <div style={{width:200,background:C.bg2,borderRight:`1px solid ${C.border}`,padding:"16px 8px",display:"flex",flexDirection:"column",flexShrink:0}}>
      <div style={{padding:"0 10px 14px",borderBottom:`1px solid ${C.border}`,marginBottom:14}}><div style={{fontSize:20,fontWeight:900,color:C.text}}>S<span style={{color:C.accent}}>&</span>S</div><div style={{fontSize:9,color:C.textDim,marginTop:1,letterSpacing:0.5}}>Scout&Stake</div></div>
      <div style={{marginBottom:14}}><div style={{fontSize:9,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1.5,padding:"0 10px",marginBottom:6}}>Role</div>{Object.entries(RC).map(([key,val])=>(<button key={key} onClick={()=>setRole(key)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:role===key?`1px solid ${val.c}33`:"1px solid transparent",background:role===key?val.d:"transparent",color:role===key?val.c:C.textDim,fontSize:12,fontWeight:role===key?700:500,cursor:"pointer",textAlign:"left",fontFamily:font,width:"100%",marginBottom:2}}><span style={{fontSize:14}}>{val.icon}</span> {val.label}</button>))}</div>
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12,flex:1}}><div style={{fontSize:9,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:1.5,padding:"0 10px",marginBottom:6}}>Screens</div>{navItems.map(n=>(<button key={n.id} onClick={()=>setActiveNav(n.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:"none",width:"100%",background:activeNav===n.id?`${rc.c}15`:"transparent",color:activeNav===n.id?rc.c:C.textDim,fontSize:12,fontWeight:activeNav===n.id?700:500,cursor:"pointer",textAlign:"left",fontFamily:font,marginBottom:2,borderLeft:activeNav===n.id?`2px solid ${rc.c}`:"2px solid transparent"}}><span style={{fontSize:13}}>{n.icon}</span> {n.label}</button>))}</div>
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}><div style={{display:"flex",alignItems:"center",gap:8,padding:"4px 10px"}}><div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${rc.c},${rc.c}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#000"}}>YH</div><div><div style={{fontSize:11,fontWeight:600,color:C.text}}>Demo User</div><div style={{fontSize:9,color:rc.c}}>{rc.label}</div></div></div></div>
    </div>
    <div style={{flex:1,padding:22,overflowY:"auto",maxHeight:"100vh"}}><ActiveScreen/></div>
  </div>);
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
